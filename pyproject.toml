[project]
name = "iu-stellic-plus-tools"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "CPY001", "INP001", "T201", "ANN401", "PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.mypy]
strict = true
mypy_path = "tools"

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
