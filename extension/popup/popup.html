<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IU Stellic Plus</title>
    <link rel="stylesheet" href="../ui/styles.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="root">
    <header>
      <h1>IU Stellic Plus</h1>
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" aria-controls="search">Search</button>
        <button role="tab" aria-selected="false" aria-controls="settings">Settings</button>
      </div>
    </header>

    <section id="search" role="tabpanel">
      <form id="search-form">
        <input id="query" type="search" placeholder="Course code or title, e.g. CSCI-C 211 or calculus" autofocus />
      </form>
      <div id="results"></div>
      <p id="hint" class="hint"></p>
    </section>

    <section id="settings" role="tabpanel" hidden>
      <div id="fields"></div>
      <div id="preview">
        Preview: <span id="preview-badge"></span> <span id="saved">Saved. Stellic updates instantly.</span>
      </div>
    </section>
  </body>
</html>
